<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escaneator</title>
<link rel="stylesheet" href="estilo.css">
<style id="estiloPagina"></style>
</head>
<body>
<header id="cabecera">
  <button class="marca" id="btnInicio" title="Volver al inicio">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
      <rect x="6" y="3" width="20" height="26" rx="2.5" fill="#f4f1ea"/>
      <rect x="10" y="8" width="12" height="2" rx="1" fill="#9aa3ad"/>
      <rect x="10" y="20" width="9" height="2" rx="1" fill="#9aa3ad"/>
      <rect x="2" y="14" width="28" height="3" rx="1.5" fill="#ff8a3d"/>
    </svg>
    <span>Escaneator</span><small>0.3</small>
  </button>
  <nav id="pasos"></nav>
  <div class="acciones">
    <span id="nombreTrabajo" class="nombreTrabajo"></span>
    <button id="btnGuardar">Guardar</button>
  </div>
</header>

<main>
  <section id="centro">
    <div id="titulo"></div>
    <div id="lienzo"></div>
    <div class="zoom" id="zoom">
      <button id="zMenos" title="Alejar">−</button>
      <button id="zAjustar" title="Volver al tamaño normal">Ajustar</button>
      <button id="zMas" title="Acercar">+</button>
    </div>
  </section>
  <aside id="der" class="panel"></aside>
</main>

<footer id="pie">
  <button id="btnAtras">← Atrás</button>
  <span id="estado"></span>
  <button id="btnSiguiente" class="principal grande">Siguiente →</button>
</footer>

<div id="impresion"></div>
<dialog id="dlg"></dialog>
<div id="avisos"></div>
<input type="file" id="ficheroDatos" accept=".csv,.txt,.xlsx,.ods" hidden>
<input type="file" id="ficheroFondo" accept="image/*,.pdf" hidden>
<input type="file" id="ficheroImagen" accept="image/*" hidden>
<input type="file" id="ficheroCalco" accept="image/*" hidden>

<script src="lib/xlsx.mini.min.js"></script>
<script src="app.js"></script>
</body>
</html>
