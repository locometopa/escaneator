[package]
name = "escaneator"
version = "0.3.0"
description = "Escaneator: etiquetas e impresos rellenados sobre una hoja escaneada"
edition = "2021"

[lib]
name = "escaneator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
